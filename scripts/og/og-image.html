<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#05070d; }
  #og{
    position:relative; width:1200px; height:630px; overflow:hidden;
    font-family:'Inter',system-ui,sans-serif;
    background:
      radial-gradient(120% 90% at 70% 12%, rgba(49,118,244,.20), transparent 55%),
      radial-gradient(70% 60% at 52% 100%, rgba(255,110,41,.10), transparent 55%),
      linear-gradient(150deg, #0d1526 0%, #0b1220 46%, #070b14 100%);
  }
  #og::before{
    content:""; position:absolute; inset:0;
    background-image:radial-gradient(rgba(148,163,184,.09) 1px, transparent 1.4px);
    background-size:26px 26px; opacity:.5; mask-image:linear-gradient(180deg,transparent,#000 22%,#000 60%,transparent);
  }
  #scene{ position:absolute; inset:0; width:1200px; height:630px; }
  .layer{ position:absolute; inset:0; }
  .brand{ position:absolute; left:56px; top:48px; display:flex; align-items:center; gap:12px; z-index:5; }
  .brand .mark{ width:48px; height:48px; }
  .brand .name{ color:#fff; font-weight:800; font-size:31px; letter-spacing:-.02em; }
  .brand .cloud{ color:#ff6e29; }
  .eyebrow{ position:absolute; left:58px; top:166px; color:#93a4bd; z-index:5;
    font-weight:600; font-size:15px; letter-spacing:.20em; text-transform:uppercase; }
  .headline{ position:absolute; left:58px; top:192px; color:#fff; font-weight:800; z-index:5;
    font-size:62px; line-height:1.06; letter-spacing:-.03em; text-shadow:0 4px 30px rgba(5,8,14,.6); }
  .headline .d{ color:#ff6e29; }
  .sub{ position:absolute; left:58px; top:414px; width:432px; color:#c4d0e2; z-index:5;
    font-weight:500; font-size:21px; line-height:1.45; text-shadow:0 2px 18px rgba(5,8,14,.7); }
  .appblk{ position:absolute; left:58px; top:506px; z-index:5; }
  .appblk .head{ display:flex; align-items:center; gap:11px; margin-bottom:13px; }
  .appblk .head img{ height:32px; width:32px; }
  .appblk .head b{ color:#fff; font-size:23px; font-weight:800; letter-spacing:-.01em; }
  .appblk .plats{ display:flex; gap:10px; }
  .appblk .plat{ display:flex; align-items:center; gap:7px; padding:8px 15px; border:1px solid rgba(148,163,184,.28);
    border-radius:999px; background:rgba(11,18,32,.55); color:#c9d4e6; font-size:15px; font-weight:600; }
  .appblk .plat svg{ width:16px; height:16px; color:#c9d4e6; }
  .phead{ position:absolute; left:947px; top:170px; width:174px; display:flex; align-items:center; justify-content:center; gap:9px; z-index:5; }
  .phead img{ height:24px; width:24px; }
  .phead span{ color:#e9f0fb; font-size:16px; font-weight:800; letter-spacing:.01em; }
  .pcap{ position:absolute; left:947px; top:381px; width:174px; text-align:center; color:#7f95b4; font-size:12.5px; font-weight:600; z-index:5; }
  .pplate{ position:absolute; left:947px; top:413px; width:174px; height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; z-index:5; }
  .pplate .lab{ color:#7d92b0; font-size:10px; font-weight:700; letter-spacing:.18em; }
  .pplate .val{ color:#eaf1fb; font-size:17px; font-weight:800; letter-spacing:.08em; }
  .psucc{ position:absolute; left:947px; top:470px; width:174px; height:46px; display:flex; align-items:center; justify-content:center; gap:8px; z-index:5; }
  .psucc .ck{ width:20px; height:20px; border-radius:50%; background:#10b981; display:flex; align-items:center; justify-content:center; }
  .psucc .ck svg{ width:11px; height:11px; display:block; }
  .psucc .tx{ color:#5ef0c0; font-size:14.5px; font-weight:800; }
</style>
</head>
<body>
<div id="og">
  <!-- REAL 3D yard -->
  <canvas id="scene" width="2400" height="1260"></canvas>

  <!-- 2D overlays: beam + phone -->
  <svg class="layer" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" style="z-index:4">
    <defs>
      <linearGradient id="phoneG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4150"/><stop offset="0.5" stop-color="#20252f"/><stop offset="1" stop-color="#12151c"/></linearGradient>
      <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111f38"/><stop offset="1" stop-color="#0b1526"/></linearGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    </defs>

    <!-- routing beam: QR -> dock 03 (endpoint tuned to 3D dock) -->
    <path d="M962 330 C 852 316 748 306 660 300" stroke="#ff6e29" stroke-width="10" fill="none" opacity="0.22" filter="url(#soft)"/>
    <path d="M962 330 C 852 316 748 306 660 300" stroke="#ffa062" stroke-width="3.6" fill="none" stroke-linecap="round" stroke-dasharray="3 11"/>
    <circle cx="962" cy="330" r="6" fill="#ffa062" filter="url(#glow)"/>

    <!-- iPhone 16 Pro Max -->
    <rect x="914" y="112" width="236" height="488" rx="52" fill="url(#phoneG)"/>
    <rect x="917" y="115" width="230" height="482" rx="49" fill="none" stroke="#5a6270" stroke-width="1.2" opacity="0.6"/>
    <rect x="923" y="121" width="218" height="470" rx="44" fill="url(#screen)"/>
    <rect x="910" y="196" width="4" height="26" rx="2" fill="#3a4150"/>
    <rect x="910" y="232" width="4" height="42" rx="2" fill="#3a4150"/>
    <rect x="1150" y="212" width="4" height="54" rx="2" fill="#3a4150"/>
    <rect x="988" y="132" width="88" height="24" rx="12" fill="#000"/>
    <circle cx="1064" cy="144" r="4" fill="#0c1a2e"/>
    <line x1="948" y1="204" x2="1116" y2="204" stroke="#1e3050" stroke-width="1.5"/>
    <rect x="957" y="224" width="150" height="150" rx="16" fill="#fff"/>
    <g id="qr" transform="translate(969,236)" fill="#0b1220"></g>
    <rect x="947" y="413" width="174" height="44" rx="11" fill="#0e1a30" stroke="#213551" stroke-width="1.5"/>
    <rect x="947" y="470" width="174" height="46" rx="13" fill="#0f2a22" stroke="#10b981" stroke-width="1.7"/>
  </svg>

  <!-- text / logos -->
  <div class="brand"><img class="mark" src="logistiq-icon.svg" alt=""/><div class="name">Logistiq</div></div>
  <div class="eyebrow">QR&nbsp;&nbsp;Warehouse&nbsp;Check-in</div>
  <div class="headline">Scan<span class="d">.</span><br>Check in<span class="d">.</span><br>Dock<span class="d">.</span></div>
  <div class="sub">QR self&#8209;check&#8209;in that routes every truck to the right dock — in real time.</div>
  <div class="appblk">
    <div class="head"><img src="qrgo-icon.svg" alt="QRGO"/><b>QRGO&nbsp;Driver</b></div>
    <div class="plats">
      <span class="plat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.5 2.6 15.5 0 18M12 3c-2.6 2.5-2.6 15.5 0 18"/></svg>Web</span>
      <span class="plat"><svg viewBox="0 0 24 24"><path d="M5 11a7 7 0 0 1 14 0v6.2a1.4 1.4 0 0 1-1.4 1.4H6.4A1.4 1.4 0 0 1 5 17.2z" fill="currentColor"/><path d="M7.6 4.4 9.4 7.1M16.4 4.4 14.6 7.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="9.6" cy="10.4" r="1.05" fill="#0b1220"/><circle cx="14.4" cy="10.4" r="1.05" fill="#0b1220"/></svg>Android</span>
      <span class="plat"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.4 12.8c0-2 1.5-2.9 1.6-3-.9-1.3-2.3-1.5-2.8-1.6-1.2-.1-2.3.7-2.9.7-.6 0-1.5-.7-2.5-.65-1.3.02-2.5.75-3.1 1.9-1.4 2.3-.4 5.8 1 7.7.6 1 1.3 2 2.3 2 .9-.04 1.3-.6 2.4-.6s1.4.6 2.4.58c1-.02 1.7-1 2.3-1.9.7-1.1 1-2.1 1-2.15-.02-.01-2.2-.85-2.2-3.3z"/><path d="M14.5 6.6c.5-.6.9-1.5.8-2.4-.8.04-1.7.54-2.2 1.15-.5.6-.9 1.45-.8 2.35.9.05 1.7-.45 2.2-1.1z"/></svg>iOS</span>
    </div>
  </div>
  <div class="phead"><img src="qrgo-icon.svg" alt="QRGO"/><span>Check-in</span></div>
  <div class="pcap">Show at gate</div>
  <div class="pplate"><span class="lab">PLATE</span><span class="val">B&nbsp;123&nbsp;XYZ</span></div>
  <div class="psucc"><span class="ck"><svg viewBox="0 0 12 12" fill="none"><path d="M2.4 6.2 l2.3 2.3 l4.9 -5.4" stroke="#04140f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="tx">Dock&nbsp;2&nbsp;assigned</span></div>
</div>

<script>
  /* QR */
  const svgns="http://www.w3.org/2000/svg";
  const qr=document.getElementById('qr');
  const N=13, cell=126/N;
  const qrect=(x,y,w,h,fill)=>{const r=document.createElementNS(svgns,'rect');r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',w);r.setAttribute('height',h);if(fill)r.setAttribute('fill',fill);qr.appendChild(r);};
  let seed=1337; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;};
  const finder=(cx,cy)=>(cx<3&&cy<3)||(cx>N-4&&cy<3)||(cx<3&&cy>N-4);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){ if(finder(x,y))continue; if(rnd()>0.52) qrect(x*cell,y*cell,cell*0.92,cell*0.92); }
  const dF=(gx,gy)=>{ qrect(gx*cell,gy*cell,cell*3,cell*3); qrect(gx*cell+cell*0.6,gy*cell+cell*0.6,cell*1.8,cell*1.8,'#fff'); qrect(gx*cell+cell*1.05,gy*cell+cell*1.05,cell*0.9,cell*0.9); };
  dF(0,0); dF(N-3,0); dF(0,N-3);
</script>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

const W=1200, H=630;
const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas, alpha:true, antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W,H,false);
renderer.setPixelRatio(1.5);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x0a1019, 16, 30);

const camera=new THREE.PerspectiveCamera(22, W/H, 0.1, 100);
camera.position.set(-1.3, 11.9, 15.4);
camera.lookAt(-0.95, 0.6, -3.4);

/* lights */
scene.add(new THREE.HemisphereLight(0xaec6e6, 0x0e1626, 0.8));
const key=new THREE.DirectionalLight(0xecf3ff, 1.5);
key.position.set(5, 11, 7);
key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.radius=6;
key.shadow.camera.near=1; key.shadow.camera.far=40;
key.shadow.camera.left=-12; key.shadow.camera.right=12;
key.shadow.camera.top=12; key.shadow.camera.bottom=-8;
scene.add(key);
const rim=new THREE.DirectionalLight(0x3f6ff0, 0.35); rim.position.set(-6,4,4); scene.add(rim);

/* materials */
const M=(c,r=0.9,m=0.0,e=0x000000,ei=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m,emissive:e,emissiveIntensity:ei});
const matGround=M(0x13203a,1);
const matBuild=M(0x28406a,0.95);
const matRoof=M(0x33507d,0.9);
const matDoor=M(0x0a1220,0.9);
const matFrame=M(0x53709e,0.7,0.1,0x2a3f63,0.25);
const matTrailer=M(0xe9eff8,0.8);
const matCab=M(0x3176f4,0.55,0.1);
const matGlass=M(0x0f2136,0.25,0.3,0x1a3a63,0.4);
const matTyre=M(0x0a0f18,0.9);
const matOrange=new THREE.MeshStandardMaterial({color:0xff6e29,roughness:0.5,emissive:0xff6e29,emissiveIntensity:0.9});

/* ground */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80), matGround);
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);

/* building */
const bW=11.4, bH=3.5, bD=2.6, bZ=-5.4;
const building=new THREE.Mesh(new THREE.BoxGeometry(bW,bH,bD), matBuild);
building.position.set(0, bH/2, bZ); building.castShadow=true; building.receiveShadow=true; scene.add(building);
const roof=new THREE.Mesh(new THREE.BoxGeometry(bW+0.2,0.25,bD+0.2), matRoof);
roof.position.set(0,bH+0.02,bZ); roof.castShadow=true; scene.add(roof);
const frontZ=bZ+bD/2;
const dockX=[-3.2,0,3.2];
dockX.forEach((dx,i)=>{
  const fr=new THREE.Mesh(new THREE.PlaneGeometry(2.16,2.62), i===1?matOrange:matFrame);
  fr.position.set(dx,1.35,frontZ+0.004); scene.add(fr);
  const door=new THREE.Mesh(new THREE.PlaneGeometry(1.94,2.36), matDoor);
  door.position.set(dx, 1.35, frontZ+0.012); scene.add(door);
});
/* dock numbers 1 / 2 / 3 (2 = assigned, orange) */
function dockNum(txt,color,dx){
  const c=document.createElement('canvas'); c.width=128; c.height=128;
  const x=c.getContext('2d'); x.fillStyle=color; x.font='800 94px Helvetica, Arial, sans-serif';
  x.textAlign='center'; x.textBaseline='middle'; x.fillText(txt,64,70);
  const t=new THREE.CanvasTexture(c); t.anisotropy=8;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthTest:false}));
  sp.position.set(dx,3.06,frontZ+0.06); sp.scale.set(0.66,0.66,1); scene.add(sp);
}
dockNum('1','#c1cddd',dockX[0]); dockNum('2','#ff7a38',dockX[1]); dockNum('3','#c1cddd',dockX[2]);

/* truck factory (backing in: trailer toward building, cab toward camera) */
function truck(x, gap){
  const g=new THREE.Group();
  const trlL=2.8, trlW=1.4, trlH=1.45;
  const rearZ=frontZ+0.05+gap;                 // rear at dock
  const trailer=new THREE.Mesh(new THREE.BoxGeometry(trlW,trlH,trlL), matTrailer);
  trailer.position.set(x, 0.62+trlH/2, rearZ+trlL/2); trailer.castShadow=true; trailer.receiveShadow=true; g.add(trailer);
  // cab
  const cabL=1.1, cabW=1.32, cabH=1.25;
  const cabZ=rearZ+trlL+0.12+cabL/2;
  const cab=new THREE.Mesh(new THREE.BoxGeometry(cabW,cabH,cabL), matCab);
  cab.position.set(x, 0.62+cabH/2, cabZ); cab.castShadow=true; g.add(cab);
  const glass=new THREE.Mesh(new THREE.PlaneGeometry(cabW*0.82,cabH*0.5), matGlass);
  glass.position.set(x, 0.62+cabH*0.62, cabZ+cabL/2+0.001); g.add(glass);
  // wheels
  const wheel=(wx,wz)=>{ const w=new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.3,0.24,20), matTyre); w.rotation.z=Math.PI/2; w.position.set(wx,0.3,wz); w.castShadow=true; g.add(w); };
  [rearZ+trlL-0.6, rearZ+trlL-1.2, rearZ+trlL-1.8].forEach(wz=>{ wheel(x-trlW/2-0.04,wz); wheel(x+trlW/2+0.04,wz); });
  wheel(x-cabW/2-0.02, cabZ+0.15); wheel(x+cabW/2+0.02, cabZ+0.15);
  scene.add(g);
}
truck(-3.2, 0.0);
truck( 3.2, 0.0);
truck( 0.0, 0.9);   // center: pulled out (reversing) + active

/* soft orange glow at active dock 03 */
const dockLight=new THREE.PointLight(0xff6e29, 3.2, 7, 2); dockLight.position.set(0, 1.4, frontZ+1.2); scene.add(dockLight);

renderer.render(scene,camera);
requestAnimationFrame(()=>{ renderer.render(scene,camera); requestAnimationFrame(()=>{ renderer.render(scene,camera); window.__sceneReady=true; }); });
</script>
</body>
</html>
